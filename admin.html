<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"><link rel="stylesheet" href="css/style.css"><title>Проверка специалистов: QADAM</title><meta name="robots" content="noindex"></head><body><div class="w">
